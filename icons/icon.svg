<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04432b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Sprout Graphic -->
  <g filter="url(#dropGlow)" transform="translate(0, -10)">
    <!-- Soil mound / furrow base -->
    <path d="M120 380 Q 256 340 392 380 Q 256 420 120 380 Z" fill="#022c1c" opacity="0.6"/>
    <path d="M140 375 Q 256 345 372 375 Q 256 400 140 375 Z" fill="#04432b"/>

    <!-- Plant Main Stem -->
    <path d="M256 370 Q 252 260 256 195" fill="none" stroke="#ecfdf5" stroke-width="20" stroke-linecap="round"/>

    <!-- Left Sprout Leaf -->
    <path d="M254 270 C 200 270 140 220 150 160 C 205 155 250 200 254 270 Z" fill="url(#leafGrad)"/>
    <path d="M254 270 Q 200 215 150 160" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>

    <!-- Right Large Sprout Leaf -->
    <path d="M256 220 C 315 220 380 170 370 100 C 310 95 260 145 256 220 Z" fill="url(#leafGrad)"/>
    <path d="M256 220 Q 315 160 370 100" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>

    <!-- Sun / Harvest Glow -->
    <circle cx="370" cy="115" r="28" fill="url(#goldGrad)" opacity="0.95"/>
    
    <!-- Direct Trade Arrow symbol -->
    <g transform="translate(256, 355) scale(0.85)">
      <circle cx="0" cy="0" r="38" fill="#ffffff" filter="url(#dropGlow)"/>
      <path d="M-18 -6 L-4 -20 L-4 -10 L14 -10 L14 -2 L-4 -2 L-4 8 Z" fill="#059669" transform="scale(0.8)"/>
      <path d="M18 6 L4 20 L4 10 L-14 10 L-14 2 L4 2 L4 -8 Z" fill="#10b981" transform="scale(0.8)"/>
    </g>
  </g>

  <!-- Typography Banner at Bottom -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">FarmDirect</text>
  <text x="256" y="475" font-family="'Noto Sans Tamil', 'Mukta Malar', sans-serif" font-size="20" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">உழவர் நேரடி சந்தை</text>
</svg>
